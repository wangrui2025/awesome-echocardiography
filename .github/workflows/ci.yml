name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  reference-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: reference/metrics_v1/requirements.txt

      - name: Install reference dependencies
        run: python -m pip install -r reference/metrics_v1/requirements.txt

      - name: Run Reference Metrics v1.1 regression tests
        working-directory: reference/metrics_v1
        run: python -m unittest -v test_reference_metrics.py

      - name: Verify frozen MONAI audit evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("reference/metrics_v1/monai_1_5_1_cpu_audit.json").read_text())
          summary = report["summary"]
          assert summary["normal_cases_compared"] == 5
          assert summary["normal_semantics_match"] is True
          assert summary["max_abs_diff_hd95"] < 1e-6
          assert summary["max_abs_diff_asd"] < 1e-6
          assert summary["empty_policy_intentionally_differs"] is True
          print("Reference Metrics v1.1 segmentation audit evidence: PASS")
          PY
